# Orquestación del servicio y única fuente de configuración por entorno.
# El secreto único de DevOps se recupera en ejecución mediante SECURITY_SECRET_ID.
# params.dev: solo generación tiene URL activa; las demás requieren confirmación.
# params.default: marcadores REPLACE_ME/.invalid pendientes; no heredar stage en qa/prod.
service: prj-cuponera-back-mdw-sls
frameworkVersion: 3.40.0
configValidationMode: error
plugins:
  - ./plugins/node24.mjs
  - ./plugins/infrastructure.mjs
  - serverless-esbuild
provider:
  name: aws
  runtime: nodejs24.x
  region: us-east-1
  stage: ${opt:stage, 'dev'}
  stackParameters:
    - ParameterKey: GatewayLogsRoleArn
      ParameterValue: ${param:gatewayLogsRoleArn}
    - ParameterKey: SecuritySecretKmsKeyArn
      ParameterValue: ${param:securitySecretKmsKeyArn}
  architecture: arm64
  memorySize: 512
  timeout: 28
  versionFunctions: true
  logRetentionInDays: ${self:custom.stageSettings.logRetention}
  endpointType: REGIONAL
  apiGateway:
    binaryMediaTypes:
      - image/png
      - image/avif
      - image/webp
      - image/apng
      - image/svg+xml
      - image/x-icon
  deploymentBucket:
    blockPublicAccess: true
    serverSideEncryption: AES256
  logs:
    restApi:
      accessLogging: true
      executionLogging: true
      fullExecutionData: false
      level: INFO
      role:
        Fn::If:
          - UseExistingGatewayLogsRole
          - Ref: GatewayLogsRoleArn
          - Fn::GetAtt:
              - ApiGatewayLoggingRole
              - Arn
      roleManagedExternally: true
      format: '{"requestId":"$context.requestId","extendedRequestId":"$context.extendedRequestId","method":"$context.httpMethod","resource":"$context.resourcePath","status":"$context.status","latency":"$context.responseLatency","integrationStatus":"$context.integrationStatus"}'
  environment:
    STAGE: ${sls:stage}
    TRANSACTIONS_TABLE:
      Ref: TransactionsPOS
    DETAILS_BUCKET:
      Ref: DetailsBucket
    SECURITY_SECRET_ID: ${param:securitySecretName}
    SECRET_CACHE_SECONDS: "300"
    HTTP_TIMEOUT_MS: "5000"
    AWS_TIMEOUT_MS: "5000"
    JWT_TTL_SECONDS: "86400"
    GENERATE_MOCK: "false"
    GENERATE_CAMPAIGN: FMR
    GENERATE_PROMOTION_ONE: OZ
    GENERATE_PROMOTION_TWO: S8
    CUPONERA_URI_TOKEN: ${param:cuponeraTokenUrl}
    CUPONERA_URI_VALIDATE_V1: ${param:cuponeraValidateUrl}
    CUPONERA_URI_REDEEM_V1: ${param:cuponeraRedeemUrl}
    CUPONERA_URI_GENERATE: ${param:cuponeraGenerateUrl}
    APISBX_URI: ${param:starbucksBaseUrl}
    APISBX_VERSION: ${param:starbucksVersion}
    APISBX_PATH_TOKEN: ${param:starbucksTokenPath}
    APISBX_PATH_SERVICE_COUPONS: ${param:starbucksCouponPath}
    OPENAPI_DEV_URL: ${param:openapiDevUrl}
    OPENAPI_PROD_URL: ${param:openapiProdUrl}
    PUBLIC_BASE_PATH: ${param:publicBasePath}
    NODE_OPTIONS: --enable-source-maps
    LOG_LEVEL: INFO
custom:
  gatewayLogsRoleArn: ${param:gatewayLogsRoleArn}
  securitySecretKmsKeyArn: ${param:securitySecretKmsKeyArn}
  securitySecretArn:
    Fn::Sub: arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${param:securitySecretName}-??????
  stages:
    dev:
      logRetention: 7
    qa:
      logRetention: 14
    prod:
      logRetention: 90
  stageSettings: ${self:custom.stages.${sls:stage}}
  esbuild: ${file(./infra/build.yml)}
package:
  individually: true
  patterns:
    - "!**"
functions: ${file(./infra/functions.yml)}
resources:
  - ${file(./infra/stack.yml)}
  - ${file(./infra/resources/storage.yml)}
  - ${file(./infra/resources/iam.yml)}
  - ${file(./infra/resources/gateway.yml)}
  - ${file(./infra/resources/observability.yml)}
params:
  default:
    securitySecretName: cuponera-api-security/${sls:stage}/aws-mdw
    securitySecretKmsKeyArn: ""
    cuponeraTokenUrl: "https://replace-me-cuponera.invalid/oauth/token"
    cuponeraValidateUrl: "https://replace-me-cuponera.invalid/cupones/"
    cuponeraRedeemUrl: "https://replace-me-cuponera.invalid/redenciones"
    cuponeraGenerateUrl: "https://replace-me-cuponera.invalid/generarCuponSocioText"
    starbucksBaseUrl: "https://replace-me-starbucks.invalid"
    starbucksVersion: "/REPLACE_ME_VERSION"
    starbucksTokenPath: "/REPLACE_ME_TOKEN_PATH"
    starbucksCouponPath: "/REPLACE_ME_COUPONS_PATH"
    openapiDevUrl: http://localhost:8080
    openapiProdUrl: https://alsea-api.com
    publicBasePath: ""
    gatewayLogsRoleArn: ""
  dev:
    cuponeraTokenUrl: https://replace-me-cuponera.invalid/oauth/token
    cuponeraValidateUrl: https://replace-me-cuponera.invalid/cupones/
    cuponeraRedeemUrl: https://replace-me-cuponera.invalid/redenciones
    cuponeraGenerateUrl: https://stage.cupones.alsea.com.mx/ext/WSCupones/cupones-api/v1/cupones/generarCuponSocioText
