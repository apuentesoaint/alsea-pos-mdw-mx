# Recursos del stack; configuración de entorno centralizada en serverless.yml.
Resources:
  AuthRole:
    Type: AWS::IAM::Role
    Metadata:
      com.aws.cloudformation.Context:
        why: Lectura del secreto único externo y permisos de la operación auth.
        must:
          - DevOps administra el secreto externo; no crear versiones desde Lambda
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: Runtime
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${self:service}-${sls:stage}-auth:*
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: ${self:custom.securitySecretArn}
                Condition:
                  Bool:
                    aws:SecureTransport: "true"
              - Fn::If:
                  - HasSecuritySecretKmsKey
                  - Effect: Allow
                    Action:
                      - kms:Decrypt
                    Resource:
                      Ref: SecuritySecretKmsKeyArn
                    Condition:
                      StringEquals:
                        kms:ViaService:
                          Fn::Sub: secretsmanager.${AWS::Region}.${AWS::URLSuffix}
                      StringLike:
                        kms:EncryptionContext:SecretARN: ${self:custom.securitySecretArn}
                  - Ref: AWS::NoValue
  ValidateRole:
    Type: AWS::IAM::Role
    Metadata:
      com.aws.cloudformation.Context:
