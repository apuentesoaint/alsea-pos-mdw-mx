# Recursos del stack; configuración de entorno centralizada en serverless.yml.
Resources:
  TransactionsPOS:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Metadata:
      com.aws.cloudformation.Context:
        why: Transacciones, pagos y referencias pendientes con consistencia fuerte.
        must:
          - No TTL ni Streams
          - Retener datos al reemplazar
    Properties:
      BillingMode: PAY_PER_REQUEST
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
        RecoveryPeriodInDays: 35
      DeletionProtectionEnabled:
        Fn::If:
          - IsProduction
          - true
          - false
  DetailsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Metadata:
      com.aws.cloudformation.Context:
        why: Detalles mayores de 300 KiB sin imponer el límite DynamoDB al contrato.
        must: []
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
  DetailsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Bucket:
        Ref: DetailsBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: HttpsOnly
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - Fn::GetAtt:
                  - DetailsBucket
                  - Arn
              - Fn::Sub: ${DetailsBucket.Arn}/*
            Condition:
              Bool:
                aws:SecureTransport: "false"
